name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: Smoke test packed tarball
        run: |
          TARBALL="$PWD/$(npm pack --silent | tail -n 1)"
          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "$TARBALL"
          node --input-type=module -e "import { createLtiTool } from 'lti-core'; if (typeof createLtiTool !== 'function') throw new Error('createLtiTool export missing'); console.log('smoke ok');"
